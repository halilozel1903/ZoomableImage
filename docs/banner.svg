<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ZoomableImage: pinch to zoom, pan and swipe-to-dismiss image viewer for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1630"/>
      <stop offset="1" stop-color="#1c1030"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6c63ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3a78"/>
      <stop offset="0.4" stop-color="#c47aa8"/>
      <stop offset="0.7" stop-color="#ffb38a"/>
      <stop offset="1" stop-color="#ffe0b8"/>
    </linearGradient>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f86d1"/>
      <stop offset="1" stop-color="#dcecf7"/>
    </linearGradient>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1b4e"/>
      <stop offset="0.6" stop-color="#f57b45"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e0"/>
      <stop offset="0.45" stop-color="#fff6e0"/>
      <stop offset="1" stop-color="#fff1c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="phoneScreen">
      <rect x="822" y="58" width="216" height="452" rx="32"/>
    </clipPath>
    <clipPath id="padScreen">
      <rect x="652" y="132" width="370" height="290" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="930" cy="160" r="250" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1160" cy="470" r="220" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="215" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="-2">ZoomableImage</text>
    <text x="82" y="268" fill="#ffd9c4" font-size="24" font-weight="500">Pinch, pan and swipe to dismiss for SwiftUI</text>
    <text x="82" y="304" fill="#b3a9cf" font-size="21" font-weight="500">iPhone · iPad · Mac, like Photos</text>
    <g font-size="19" font-weight="600">
      <rect x="82" y="340" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="157" y="366" fill="#fdeee6" text-anchor="middle">Pinch &amp; pan</text>
      <rect x="244" y="340" width="138" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="313" y="366" fill="#fdeee6" text-anchor="middle">Double tap</text>
      <rect x="394" y="340" width="200" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="494" y="366" fill="#fdeee6" text-anchor="middle">Swipe to dismiss</text>
      <rect x="82" y="392" width="112" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="138" y="418" fill="#fdeee6" text-anchor="middle">Gallery</text>
      <rect x="206" y="392" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="258" y="418" fill="#fdeee6" text-anchor="middle">Swift 6</text>
      <rect x="322" y="392" width="80" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="362" y="418" fill="#fdeee6" text-anchor="middle">SPM</text>
    </g>
  </g>

  <!-- iPad: the journal grid behind -->
  <g transform="translate(80 0)">
  <g filter="url(#shadow)">
    <rect x="640" y="120" width="394" height="314" rx="24" fill="#1c1f26" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#padScreen)">
    <rect x="652" y="132" width="370" height="290" fill="#ffffff"/>
    <text x="668" y="166" fill="#111827" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="800">Trailbook</text>
    <text x="668" y="190" fill="#6b7280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700">Dolomites</text>
    <g>
      <rect x="668" y="200" width="70" height="70" fill="url(#sky)"/>
      <path d="M668 252 L690 232 L705 242 L722 222 L738 240 L738 270 L668 270 Z" fill="#5d4f86"/>
      <rect x="741" y="200" width="70" height="70" fill="url(#sky2)"/>
      <path d="M741 250 L765 222 L785 240 L811 228 L811 270 L741 270 Z" fill="#6f86a8"/>
      <rect x="814" y="200" width="70" height="70" fill="url(#sky3)"/>
      <path d="M814 255 L840 255 L846 236 L866 236 L872 255 L884 255 L884 270 L814 270 Z" fill="#6b2c45"/>
      <rect x="887" y="200" width="70" height="70" fill="#c9d6e3"/>
      <path d="M887 240 L910 228 L935 238 L957 226 L957 270 L887 270 Z" fill="#7489a3"/>
      <path d="M887 256 L915 246 L940 254 L957 248 L957 270 L887 270 Z" fill="#405670"/>
      <rect x="960" y="200" width="62" height="70" fill="url(#sky)"/>
      <rect x="668" y="273" width="70" height="70" fill="#7fb3d9"/>
      <path d="M668 320 L700 304 L738 316 L738 343 L668 343 Z" fill="#c46a32"/>
      <rect x="741" y="273" width="70" height="70" fill="#061024"/>
      <circle cx="790" cy="288" r="5" fill="#f4f1e1"/>
      <path d="M741 330 L776 300 L811 330 L811 343 L741 343 Z" fill="#141c3a"/>
      <rect x="814" y="273" width="70" height="70" fill="url(#sky2)"/>
      <rect x="887" y="273" width="70" height="70" fill="url(#sky3)"/>
      <rect x="960" y="273" width="62" height="70" fill="#7b6bb3"/>
      <rect x="668" y="346" width="70" height="70" fill="url(#sky3)"/>
      <rect x="741" y="346" width="70" height="70" fill="#c9d6e3"/>
      <rect x="814" y="346" width="70" height="70" fill="url(#sky)"/>
      <rect x="887" y="346" width="70" height="70" fill="#7fb3d9"/>
      <rect x="960" y="346" width="62" height="70" fill="url(#sky2)"/>
    </g>
  </g>

  </g>

  <!-- iPhone: a photo zoomed in on the cabin -->
  <g transform="translate(40 0)">
  <g filter="url(#shadow)">
    <rect x="810" y="46" width="240" height="476" rx="42" fill="#15171c" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <g clip-path="url(#phoneScreen)">
    <rect x="822" y="58" width="216" height="452" fill="url(#sky)"/>
    <circle cx="860" cy="200" r="70" fill="url(#sun)"/>
    <path d="M822 300 L870 250 L905 270 L960 190 L1010 250 L1038 236 L1038 510 L822 510 Z" fill="#8a7bb0"/>
    <path d="M960 190 L944 214 L956 210 L966 220 L976 208 Z" fill="#f1e4ef"/>
    <path d="M822 350 L880 318 L940 338 L1000 310 L1038 324 L1038 510 L822 510 Z" fill="#5d4f86"/>
    <path d="M822 404 L1038 380 L1038 510 L822 510 Z" fill="#3d2f55"/>
    <!-- the cabin, large -->
    <rect x="896" y="352" width="88" height="56" fill="#4a2e2a"/>
    <path d="M884 352 L940 310 L996 352 Z" fill="#2b1d22"/>
    <rect x="910" y="366" width="20" height="20" fill="#ffd27a"/>
    <rect x="950" y="370" width="18" height="38" fill="#2a1a18"/>
    <circle cx="975" cy="296" r="6" fill="#f6e3e8"/>
    <circle cx="982" cy="280" r="9" fill="#f9eef1"/>
    <circle cx="992" cy="260" r="12" fill="#ffffff"/>
    <path d="M822 430 L846 388 L870 430 Z M1000 440 L1022 396 L1044 440 Z" fill="#2a2140"/>
    <path d="M822 470 L1038 450 L1038 510 L822 510 Z" fill="#231a35"/>
    <!-- gallery controls -->
    <circle cx="846" cy="92" r="13" fill="#ffffff" fill-opacity="0.25"/>
    <path d="M841 87 L851 97 M851 87 L841 97" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="904" y="80" width="54" height="24" rx="12" fill="#ffffff" fill-opacity="0.25"/>
    <text x="931" y="97" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1 of 12</text>
    <g>
      <rect x="846" y="470" width="20" height="28" rx="3" fill="#ffffff" fill-opacity="0.6"/>
      <rect x="870" y="466" width="34" height="32" rx="4" fill="url(#sky)" stroke="#ffffff" stroke-width="2"/>
      <rect x="908" y="470" width="20" height="28" rx="3" fill="url(#sky2)"/>
      <rect x="932" y="470" width="20" height="28" rx="3" fill="url(#sky3)"/>
      <rect x="956" y="470" width="20" height="28" rx="3" fill="#c9d6e3"/>
      <rect x="980" y="470" width="20" height="28" rx="3" fill="#7fb3d9"/>
      <rect x="1004" y="470" width="20" height="28" rx="3" fill="#7b6bb3"/>
    </g>
  </g>

  <!-- pinch: two fingertips moving apart -->
  <g>
    <circle cx="890" cy="268" r="22" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="2"/>
    <circle cx="990" cy="430" r="22" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-width="2"/>
    <path d="M876 250 L862 232 M862 232 L862 246 M862 232 L876 232" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M1004 448 L1018 466 M1018 466 L1018 452 M1018 466 L1004 466" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800">
    <rect x="1064" y="96" width="76" height="36" rx="18" fill="#ff8a5c"/>
    <text x="1102" y="120" fill="#ffffff" font-size="18" text-anchor="middle">2.5×</text>
  </g>
  </g>
</svg>
